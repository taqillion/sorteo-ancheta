<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo de Ancheta</title>
<meta name="description" content="Tablero del sorteo de ancheta. Boleta a $6.000, juega con la Lotería de Boyacá el 26 de septiembre.">
<meta property="og:title" content="Sorteo de Ancheta">
<meta property="og:description" content="Boleta a $6.000. Juega con la Lotería de Boyacá el 26 de septiembre.">
<meta name="theme-color" content="#7a0c3e">
<style>
  :root{
    --vino:#7a0c3e;
    --magenta:#c2185b;
    --rosa:#f7d6e6;
    --fondo:#fbeef4;
    --tinta:#3a0a20;
    --blanco:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--tinta);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;}
  .app{max-width:600px;margin:0 auto;padding:0 12px 32px}
  .barra{position:sticky;top:0;z-index:20;background:rgba(251,238,244,.94);
    backdrop-filter:blur(6px);padding:12px 0 10px;display:flex;flex-wrap:wrap;
    align-items:center;gap:10px;justify-content:space-between}
  .conteo{display:flex;gap:14px;align-items:baseline;font-size:15px}
  .conteo b{font-size:26px;color:var(--vino);font-variant-numeric:tabular-nums;margin-right:4px}
  .acciones{display:flex;gap:8px}
  button.btn{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:10px 16px;
    cursor:pointer;border:2px solid var(--vino);transition:transform .08s ease}
  button.btn:active{transform:scale(.97)}
  .btn-principal{background:var(--vino);color:var(--blanco)}
  .btn-secundario{background:transparent;color:var(--vino)}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}

  .poster{position:relative;width:100%;aspect-ratio:1024/1536;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px -12px rgba(122,12,62,.45)}
  .poster img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .celda{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;
    border-radius:6px;-webkit-tap-highlight-color:transparent}
  .celda:hover{background:rgba(122,12,62,.08)}
  .celda svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.6);
    transition:opacity .15s ease,transform .15s ease;pointer-events:none}
  .celda.tachado{background:rgba(58,10,32,.26)}
  .celda.tachado svg{opacity:1;transform:scale(1)}
  .celda:focus-visible{outline:3px solid #2b6cff;outline-offset:-2px}

  .ayuda{font-size:14px;margin:10px 2px 0;opacity:.8}
  .estado{font-size:13px;opacity:.7}

  .cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(251,238,244,.7);font-weight:700;color:var(--vino);z-index:5}

  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--tinta);color:var(--blanco);padding:10px 12px 10px 16px;border-radius:999px;
    display:flex;gap:12px;align-items:center;font-size:15px;transition:all .2s ease;z-index:40;
    pointer-events:none;max-width:calc(100% - 24px)}
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast button{font:inherit;font-weight:700;background:var(--rosa);color:var(--vino);border:0;
    border-radius:999px;padding:6px 12px;cursor:pointer}

  .modal{position:fixed;inset:0;background:rgba(58,10,32,.6);display:none;align-items:center;
    justify-content:center;padding:16px;z-index:50}
  .modal.visible{display:flex}
  .modal-caja{background:var(--blanco);border-radius:16px;padding:16px;max-width:420px;width:100%;
    max-height:92vh;display:flex;flex-direction:column;gap:12px}
  .modal-caja h2{margin:0;font-size:19px;color:var(--vino)}
  .modal-caja p{margin:0;font-size:14px}
  .modal-caja img{width:100%;max-height:55vh;object-fit:contain;border-radius:8px;background:var(--fondo)}
  .modal-acciones{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:420px){.conteo b{font-size:22px}button.btn{padding:9px 13px;font-size:14px}}
</style>
</head>

    <div>

        <span><b id="nLibres">100</b>libres</span>
      </div>
      <div class="estado" id="estado">Cargando números guardados...</div>
    </div>
    <div class="acciones">
      <button class="btn btn-secundario" id="btnBorrar" disabled>Borrar todo</button>
      <button class="btn btn-principal" id="btnExportar">Compartir</button>
    </div>
  </div>

    <div class="cargando" id="cargando">Cargando...</div>
  </div>
  <p class="ayuda">Toca un número para tacharlo. Tócalo otra vez para liberarlo.</p>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastTexto"></span>
  <button id="toastAccion" hidden>Deshacer</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="modal-caja">
    <h2 id="modalTitulo">Comparte la imagen</h2>
    <p>Mantén presionada la imagen para compartirla por WhatsApp u otra app, o para guardarla en tu galería.</p>
    <img id="modalImg" alt="Vista previa del tablero con los números tachados">
    <div class="modal-acciones">
      <button class="btn btn-secundario" id="modalCerrar">Cerrar</button>
    </div>
  </div>
</div>

<script>
(function(){
  // Coordenadas de las celdas medidas sobre la imagen original (1024 x 1536)
  const ANCHO = 1024, ALTO = 1536;
  const COLS = [[27,116],[124,213],[222,311],[320,409],[418,507],[515,605],[613,703],[711,801],[809,898],[907,996]];
  const FILAS = [[706,768],[772,833],[840,902],[910,972],[980,1043],[1052,1116],[1124,1188],[1196,1262],[1272,1341],[1352,1420]];
  const CLAVE = "sorteo-ancheta:tachados";

  const tachados = new Set();
  let version = 0;
  const botones = [];
  const poster = document.getElementById("poster");
  const img = document.getElementById("imgPoster");
  const nT = document.getElementById("nTachados");
  const nL = document.getElementById("nLibres");
  const estado = document.getElementById("estado");
  const btnBorrar = document.getElementById("btnBorrar");
  const btnExportar = document.getElementById("btnExportar");

  const svgX = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
    '<line x1="10" y1="12" x2="90" y2="88" stroke="#d70028" stroke-opacity=".92" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<line x1="90" y1="12" x2="10" y2="88" stroke="#d70028" stroke-opacity=".92" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';

  function etiqueta(n){ return String(n).padStart(2,"0"); }

  // Crear botones sobre cada número
  for (let f = 0; f < 10; f++){
    for (let c = 0; c < 10; c++){
      const n = f * 10 + c;
      const [x1,x2] = COLS[c], [y1,y2] = FILAS[f];
      const b = document.createElement("button");
      b.className = "celda";
      b.style.left = (x1/ANCHO*100) + "%";
      b.style.top = (y1/ALTO*100) + "%";
      b.style.width = ((x2-x1)/ANCHO*100) + "%";
      b.style.height = ((y2-y1)/ALTO*100) + "%";
      b.innerHTML = svgX;
      b.addEventListener("click", () => alternar(n));
      poster.appendChild(b);
      botones[n] = b;
    }
  }

  function pintar(){
    for (let n = 0; n < 100; n++){
      const on = tachados.has(n);
      botones[n].classList.toggle("tachado", on);
      botones[n].setAttribute("aria-pressed", on ? "true" : "false");
      botones[n].setAttribute("aria-label", "Número " + etiqueta(n) + (on ? ", tachado" : ", libre"));
    }
    nT.textContent = tachados.size;
    nL.textContent = 100 - tachados.size;
    btnBorrar.disabled = tachados.size === 0;
    version++;
    programarImagen();
  }

  // Guardado persistente: almacenamiento de Claude si existe, si no el del navegador
  const almacen = {
    async leer(){
      if (window.storage){
        try { const r = await window.storage.get(CLAVE, false); return r ? r.value : null; }
        catch (e) { return null; }
      }
      try { return window.localStorage.getItem(CLAVE); } catch (e) { return null; }
    },
    async escribir(valor){
      if (window.storage){
        const r = await window.storage.set(CLAVE, valor, false);
        return !!r;
      }
      window.localStorage.setItem(CLAVE, valor);
      return true;
    }
  };

  let temporizador = null;
  function guardar(){
    clearTimeout(temporizador);
    estado.textContent = "Guardando...";
    temporizador = setTimeout(async () => {
      try {
        const lista = [...tachados].sort((a,b) => a-b);
        const ok = await almacen.escribir(JSON.stringify(lista));
        estado.textContent = ok ? "Cambios guardados" : "No se pudo guardar. Intenta de nuevo.";
      } catch (e) {
        estado.textContent = "No se pudo guardar en este navegador. Comparte la imagen como respaldo.";
      }
    }, 350);
  }

  async function cargar(){
    try {
      const valor = await almacen.leer();
      if (valor){
        JSON.parse(valor).forEach(n => { if (Number.isInteger(n) && n >= 0 && n < 100) tachados.add(n); });
      }
      estado.textContent = tachados.size ? "Números guardados cargados" : "Listo";
    } catch (e) {
      estado.textContent = "Listo";
    }
    document.getElementById("cargando").remove();
    pintar();
  }

  function alternar(n){
    if (tachados.has(n)) tachados.delete(n); else tachados.add(n);
    pintar();
    guardar();
  }

  // Aviso con opción de deshacer
  const toast = document.getElementById("toast");
  const toastTexto = document.getElementById("toastTexto");
  const toastAccion = document.getElementById("toastAccion");
  let toastTimer = null, accionDeshacer = null;
  function avisar(texto, deshacer){
    toastTexto.textContent = texto;
    accionDeshacer = deshacer || null;
    toastAccion.hidden = !deshacer;
    toast.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove("visible"); accionDeshacer = null; }, 6000);
  }
  toastAccion.addEventListener("click", () => {
    if (accionDeshacer) accionDeshacer();
    toast.classList.remove("visible");
    accionDeshacer = null;
  });

  btnBorrar.addEventListener("click", () => {
    const copia = [...tachados];
    tachados.clear();
    pintar();
    guardar();
    avisar("Se borraron " + copia.length + " números", () => {
      copia.forEach(n => tachados.add(n));
      pintar();
      guardar();
      avisar("Números restaurados");
    });
  });

  // Compartir imagen
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  let cache = { version: -1, archivo: null, dataUrl: null };
  let prepTimer = null;

  function dibujarX(ctx, x1, y1, x2, y2){
    const w = x2 - x1, h = y2 - y1;
    ctx.fillStyle = "rgba(58,10,32,0.26)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x1, y1, w, h, 8); else ctx.rect(x1, y1, w, h);
    ctx.fill();
    const ax = x1 + w*0.10, bx = x2 - w*0.10, ay = y1 + h*0.12, by = y2 - h*0.12;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(215,0,40,0.92)";
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, ay); ctx.lineTo(ax, by); ctx.stroke();
  }

  function nombreArchivo(){
    const hoy = new Date();
    return "sorteo-ancheta-" + hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2,"0") + "-" + String(hoy.getDate()).padStart(2,"0") + ".png";
  }

  // Genera el PNG del estado actual y lo guarda en caché
  async function generarImagen(){
    const v = version;
    if (cache.version === v && cache.archivo) return cache;
    if (!img.complete || !img.naturalWidth) await new Promise(res => img.addEventListener("load", res, { once: true }));
    const canvas = document.createElement("canvas");
    canvas.width = ANCHO; canvas.height = ALTO;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, ANCHO, ALTO);
    tachados.forEach(n => {
      const f = Math.floor(n/10), c = n % 10;
      dibujarX(ctx, COLS[c][0], FILAS[f][0], COLS[c][1], FILAS[f][1]);
    });
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    if (!blob) throw new Error("sin imagen");
    if (v !== version) return generarImagen();
    const archivo = new File([blob], nombreArchivo(), { type: "image/png" });
    cache = { version: v, archivo, dataUrl: null };
    return cache;
  }

  // Prepara la imagen por adelantado para que compartir sea inmediato
  function programarImagen(){
    clearTimeout(prepTimer);
    prepTimer = setTimeout(() => { generarImagen().catch(() => {}); }, 300);
  }

  function leerComoDataUrl(archivo){
    return new Promise((res, rej) => {
      const lector = new FileReader();
      lector.onload = () => res(lector.result);
      lector.onerror = () => rej(lector.error);
      lector.readAsDataURL(archivo);
    });
  }

  async function mostrarAlternativa(datos){
    if (!datos.dataUrl) datos.dataUrl = await leerComoDataUrl(datos.archivo);
    modalImg.src = datos.dataUrl;
    modal.classList.add("visible");
    document.getElementById("modalCerrar").focus();
  }

  btnExportar.addEventListener("click", async () => {
    const lista = cache.version === version && cache.archivo;
    if (!lista){
      btnExportar.disabled = true;
      btnExportar.textContent = "Preparando...";
    }
    let datos;
    try {
      datos = await generarImagen();
    } catch (e) {
      avisar("No se pudo crear la imagen. Intenta de nuevo.");
      btnExportar.disabled = false;
      btnExportar.textContent = "Compartir";
      return;
    }
    btnExportar.disabled = false;
    btnExportar.textContent = "Compartir";

    const paquete = { files: [datos.archivo], title: "Sorteo de ancheta" };
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [datos.archivo] })){
      try {
        await navigator.share(paquete);
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // La persona cerró el menú de compartir
      }
    }
    try {
      btnExportar.disabled = true;
      btnExportar.textContent = "Preparando...";
      await mostrarAlternativa(datos);
    } catch (e) {
      avisar("No se pudo mostrar la imagen. Intenta de nuevo.");
    } finally {
      btnExportar.disabled = false;
      btnExportar.textContent = "Compartir";
    }
  });

  function cerrarModal(){ modal.classList.remove("visible"); btnExportar.focus(); }
  document.getElementById("modalCerrar").addEventListener("click", cerrarModal);
  modal.addEventListener("click", e => { if (e.target === modal) cerrarModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("visible")) cerrarModal(); });

  pintar();
  cargar();
})();
</script>
</body>
</html>
